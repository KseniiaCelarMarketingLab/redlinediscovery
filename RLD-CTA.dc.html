<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Open Sans',system-ui,sans-serif">
  <section style="background:#fbfdfe;padding:clamp(56px,7vw,96px) clamp(18px,3vw,28px)">
    <div style="max-width:820px;margin:0 auto">
      <h2 style="font-size:50px;line-height:1.1;letter-spacing:-0.025em;font-weight:800;color:#131d22;margin:0 0 20px;text-align:center;text-wrap:pretty">Transform your investigation process today to prepare for the future threads</h2>
      <p style="font-family:'IBM Plex Mono',monospace;font-size:17px;line-height:1.7;color:#4a5c66;margin:0 0 48px;text-align:center">Improve processes. Collect evidence. Enhance investigations.</p>
      <div style="display:grid;gap:16px">
        <input type="text" placeholder="Full Name" style="background:#e3eff4;border:1px solid transparent;border-radius:999px;padding:20px 26px;font-size:16px;color:#131d22;outline:none;min-height:56px;width:100%" style-focus="border-color:#5a7484;background:#eef6fa" />
        <input type="text" placeholder="Company" style="background:#e3eff4;border:1px solid transparent;border-radius:999px;padding:20px 26px;font-size:16px;color:#131d22;outline:none;min-height:56px;width:100%" style-focus="border-color:#5a7484;background:#eef6fa" />
        <input type="email" placeholder="Email" style="background:#e3eff4;border:1px solid transparent;border-radius:999px;padding:20px 26px;font-size:16px;color:#131d22;outline:none;min-height:56px;width:100%" style-focus="border-color:#5a7484;background:#eef6fa" />
        <input type="tel" placeholder="Phone" style="background:#e3eff4;border:1px solid transparent;border-radius:999px;padding:20px 26px;font-size:16px;color:#131d22;outline:none;min-height:56px;width:100%" style-focus="border-color:#5a7484;background:#eef6fa" />
        <select style="background:#e3eff4;border:1px solid transparent;border-radius:999px;padding:20px 26px;font-size:17px;color:#5a7484;outline:none;appearance:none" style-focus="border-color:#5a7484;background:#eef6fa">
          <option>Topic</option>
          <option>Book a demo</option>
          <option>For law firms</option>
          <option>Training &amp; support</option>
          <option>Partnership</option>
          <option>Other</option>
        </select>
        <textarea placeholder="Type your message here..." rows="6" style="background:#e3eff4;border:1px solid transparent;border-radius:24px;padding:22px 26px;font-size:17px;color:#131d22;outline:none;resize:vertical" style-focus="border-color:#5a7484;background:#eef6fa"></textarea>
        <label style="display:flex;align-items:center;gap:14px;font-size:16px;color:#4a5c66;cursor:pointer;padding:4px 6px">
          <input type="checkbox" style="width:22px;height:22px;accent-color:#a21c26" />
          <span>I agree to the terms of the <a href="#" style="font-weight:700">Privacy Policy</a></span>
        </label>
        <label style="display:flex;align-items:center;gap:14px;font-size:16px;color:#4a5c66;cursor:pointer;padding:4px 6px">
          <input type="checkbox" style="width:22px;height:22px;accent-color:#a21c26" />
          <span>Marketing email Opt-in</span>
        </label>
        <button type="button" style="background:#a21c26;color:#ffffff;border:none;border-radius:999px;padding:20px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px;min-height:56px" style-hover="background:#131d22">Submit</button>
      </div>
    </div>
  </section>

  <section style="background:#e3eff4;padding:clamp(44px,5.5vw,72px) clamp(18px,3vw,28px)">
    <div style="max-width:820px;margin:0 auto">
      <h3 style="font-size:28px;font-weight:800;letter-spacing:-0.015em;color:#131d22;margin:0 0 8px">Subscribe to Redline Discovery Newsletter</h3>
      <p style="font-size:16px;line-height:1.6;color:#4a5c66;margin:0 0 32px">A monthly bulletin on the intersection of technology and crime. <span style="color:#a21c26">*</span> indicates required</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px">
        <label style="display:block">
          <span style="display:block;font-size:15px;font-weight:600;color:#131d22;margin-bottom:8px">Email Address <span style="color:#a21c26">*</span></span>
          <input type="email" style="width:100%;background:#ffffff;border:1px solid rgba(90,116,132,0.28);border-radius:10px;padding:14px 16px;font-size:16px;color:#131d22;outline:none" style-focus="border-color:#5a7484" />
        </label>
        <label style="display:block">
          <span style="display:block;font-size:15px;font-weight:600;color:#131d22;margin-bottom:8px">First Name <span style="color:#a21c26">*</span></span>
          <input type="text" style="width:100%;background:#ffffff;border:1px solid rgba(90,116,132,0.28);border-radius:10px;padding:14px 16px;font-size:16px;color:#131d22;outline:none" style-focus="border-color:#5a7484" />
        </label>
        <label style="display:block">
          <span style="display:block;font-size:15px;font-weight:600;color:#131d22;margin-bottom:8px">Last Name <span style="color:#a21c26">*</span></span>
          <input type="text" style="width:100%;background:#ffffff;border:1px solid rgba(90,116,132,0.28);border-radius:10px;padding:14px 16px;font-size:16px;color:#131d22;outline:none" style-focus="border-color:#5a7484" />
        </label>
        <label style="display:block">
          <span style="display:block;font-size:15px;font-weight:600;color:#131d22;margin-bottom:8px">Company <span style="color:#a21c26">*</span></span>
          <input type="text" style="width:100%;background:#ffffff;border:1px solid rgba(90,116,132,0.28);border-radius:10px;padding:14px 16px;font-size:16px;color:#131d22;outline:none" style-focus="border-color:#5a7484" />
        </label>
      </div>
      <button type="button" style="margin-top:26px;background:#5a7484;color:#ffffff;border:none;border-radius:999px;padding:15px 38px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px" style-hover="background:#131d22">Subscribe</button>
    </div>
  </section>
</div>
</x-dc>
</body>
</html>
